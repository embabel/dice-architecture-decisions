server.address=127.0.0.1
server.port=8082
spring.mvc.problemdetails.enabled=true
spring.web.resources.cache.cachecontrol.no-cache=true
decisions.history-file=${DECISIONS_HISTORY_FILE:./data/decision-history.json}
spring.application.name=dice-architecture-decisions

spring.ai.model.chat=none
spring.ai.model.embedding=none

#---
spring.config.activate.on-profile=!live
spring.autoconfigure.exclude=com.embabel.agent.autoconfigure.models.openai.AgentOpenAiAutoConfiguration,com.embabel.agent.autoconfigure.platform.AgentPlatformAutoConfiguration
